# The CNTi essential tests on Routr 3's chart (fonoster/routr, branch v3):
# - routr-v3-alpha: the chart at tag v3.0.0-alpha.6 (v3's head) with its
#   appVersion set to the alpha, as the alpha charts are built, so every
#   Routr image is the Go 3.0.0-alpha.6 one;
# - routr-v3-fixes: the same with the proposed chart fixes (martin-mat/routr,
#   branch cnti-chart-fixes, on v3): readiness probes, memory requests and
#   limits, a non-root group and a fast shutdown for the bundled PostgreSQL
#   and Redis. (v3's chart on its own appVersion, 2.32.2, does not install.)
# Both run on four workers: EdgePort is one replica per node by
# design, so a drain and a scale to 4 need room (cnf/routr-v3-alpha/kind.yaml).
# Storage that follows the pod, so node_drain can move the StatefulSets'
# volumes: kind's local-path provisioner in shared mode.
name: Routr v3 measure
on:
  push:
    branches: [telco-candidates-measure]
    paths: [.github/workflows/routr-v3-measure.yml, cnf/routr-v3-alpha/**, cnf/routr-v3-fixes/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  essential:
    name: essential (${{ matrix.cnf }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - cnf: routr-v3-alpha
            repo: fonoster/routr
            ref: v3.0.0-alpha.6
            app_version: 3.0.0-alpha.6
            kind: cnf/routr-v3-alpha/kind.yaml
          - cnf: routr-v3-fixes
            repo: martin-mat/routr
            ref: cnti-chart-fixes
            app_version: 3.0.0-alpha.6
            kind: cnf/routr-v3-alpha/kind.yaml
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: cnf/${{ matrix.cnf }}/src
          persist-credentials: false
      - name: Chart commit
        run: |
          git -C cnf/${{ matrix.cnf }}/src log -1 --format='%H %cs %s'
          if [ -n "${{ matrix.app_version }}" ]; then
            sed -i 's/^appVersion: .*/appVersion: ${{ matrix.app_version }}/' cnf/${{ matrix.cnf }}/src/ops/charts/connect/Chart.yaml
          fi
          grep -E '^(version|appVersion)' cnf/${{ matrix.cnf }}/src/ops/charts/connect/Chart.yaml

      - name: Create the cluster
        run: |
          set -euo pipefail
          mkdir -p /tmp/kind-shared-storage
          kind create cluster --name cnti-testsuite --config ${{ matrix.kind }}
          kubectl -n local-path-storage patch configmap local-path-config --type merge \
            -p '{"data":{"config.json":"{\"nodePathMap\":[],\"sharedFileSystemPath\":\"/var/local-path-provisioner\"}"}}'
          kubectl -n local-path-storage rollout restart deployment local-path-provisioner
          kubectl -n local-path-storage rollout status deployment local-path-provisioner --timeout 2m
          kubectl get nodes -o wide

      - uses: lfn-cnti/testsuite-action@3c0e163cbbdde302cdd9abb9dbe8c2cbd6a72c71 # v1.4.0
        with:
          version: v2.4.1
          cnf_config: cnf/${{ matrix.cnf }}/cnti-testsuite.yaml
          create_kind_cluster: false
          install_timeout: 900
          tests: cert
          fail_on_failure: "false"

      - name: Diagnostics
        if: always()
        run: |
          set +e
          kubectl get pods -A -o wide
          kubectl get pvc -A
          kubectl -n routr describe pods | tail -120
          kubectl -n routr get events --sort-by=.lastTimestamp | tail -40
          # Memory working set per container (kubelet summary; no metrics-server)
          for node in $(kubectl get nodes -o name | cut -d/ -f2); do
            kubectl get --raw "/api/v1/nodes/$node/proxy/stats/summary" |
              jq -r '.pods[] | select(.podRef.namespace=="routr") | .podRef.name as $p | .containers[] | "memory \($p) \(.name) \((.memory.workingSetBytes // 0) / 1048576 | floor)Mi"'
          done
