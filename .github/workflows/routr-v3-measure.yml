# The CNTi essential tests on Routr 3's chart (fonoster/routr, branch v3) with
# the proposed chart fixes (martin-mat/routr, branch cnti-chart-fixes, on v3):
# readiness probes, memory requests and limits, a non-root group for the
# bundled PostgreSQL (with writable directories) and Redis. The chart's appVersion is set to 3.0.0-alpha.6, as
# the alpha charts are built, so every Routr image is the Go alpha.
# routr-v3-fixes-pg0 (PostgreSQL left in the image's root group) gave 14/19 in
# run 43518981095, next to 15/19 with all the fixes.
# v3's chart on its own appVersion (2.32.2) does not install; alpha.6 without
# the fixes gave 12/19 (runs 43508491774 and 43513420167).
# Four workers: EdgePort is one replica per node by design, so a drain and a
# scale to 4 need room (cnf/routr-v3-alpha/kind.yaml). Storage that follows
# the pod, so node_drain can move the StatefulSets' volumes: kind's
# local-path provisioner in shared mode.
name: Routr v3 measure
on:
  push:
    branches: [telco-candidates-measure]
    paths: [.github/workflows/routr-v3-measure.yml, cnf/routr-v3-alpha/**, cnf/routr-v3-fixes/**, cnf/routr-v3-fixes-pg0/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  essential:
    name: essential (${{ matrix.cnf }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - cnf: routr-v3-fixes
            repo: martin-mat/routr
            ref: cnti-chart-fixes
            app_version: 3.0.0-alpha.6
            kind: cnf/routr-v3-alpha/kind.yaml
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: cnf/${{ matrix.cnf }}/src
          persist-credentials: false
      - name: Chart commit
        run: |
          git -C cnf/${{ matrix.cnf }}/src log -1 --format='%H %cs %s'
          if [ -n "${{ matrix.app_version }}" ]; then
            sed -i 's/^appVersion: .*/appVersion: ${{ matrix.app_version }}/' cnf/${{ matrix.cnf }}/src/ops/charts/connect/Chart.yaml
          fi
          grep -E '^(version|appVersion)' cnf/${{ matrix.cnf }}/src/ops/charts/connect/Chart.yaml

      - name: Create the cluster
        run: |
          set -euo pipefail
          mkdir -p /tmp/kind-shared-storage
          kind create cluster --name cnti-testsuite --config ${{ matrix.kind }}
          kubectl -n local-path-storage patch configmap local-path-config --type merge \
            -p '{"data":{"config.json":"{\"nodePathMap\":[],\"sharedFileSystemPath\":\"/var/local-path-provisioner\"}"}}'
          kubectl -n local-path-storage rollout restart deployment local-path-provisioner
          kubectl -n local-path-storage rollout status deployment local-path-provisioner --timeout 2m
          kubectl get nodes -o wide

      - name: Install check (fixes only)
        if: startsWith(matrix.cnf, 'routr-v3-fixes')
        run: |
          set +e
          helm install routr cnf/${{ matrix.cnf }}/src/ops/charts/connect -n routr $(yq '.deployments.helm_dirs[0].helm_values // ""' cnf/${{ matrix.cnf }}/cnti-testsuite.yaml) --create-namespace --timeout 6m --wait --wait-for-jobs
          echo "helm exit $?"
          kubectl -n routr get pods -o wide
          for p in $(kubectl -n routr get pods -o name); do
            echo "== $p"; kubectl -n routr logs "$p" --all-containers --tail=30 --prefix
            kubectl -n routr get "$p" -o jsonpath='{range .status.containerStatuses[*]}{.name} restarts={.restartCount} {.lastState}{"\n"}{end}'
          done
          kubectl -n routr get events --sort-by=.lastTimestamp | tail -30
          # Memory working set per container after a minute idle, from the
          # kubelet summary (no metrics-server), for sizing the requests and limits
          sleep 60
          for node in $(kubectl get nodes -o name | cut -d/ -f2); do
            kubectl get --raw "/api/v1/nodes/$node/proxy/stats/summary" |
              jq -r '.pods[] | select(.podRef.namespace=="routr") | .podRef.name as $p | .containers[] | "memory \($p) \(.name) \((.memory.workingSetBytes // 0) / 1048576 | floor)Mi"'
          done
          helm uninstall routr -n routr --wait --timeout 3m
          kubectl delete namespace routr --wait --timeout 3m

      - uses: lfn-cnti/testsuite-action@3c0e163cbbdde302cdd9abb9dbe8c2cbd6a72c71 # v1.4.0
        with:
          version: v2.4.1
          cnf_config: cnf/${{ matrix.cnf }}/cnti-testsuite.yaml
          create_kind_cluster: false
          install_timeout: 900
          tests: cert
          fail_on_failure: "false"

      - name: Diagnostics
        if: always()
        run: |
          set +e
          kubectl get pods -A -o wide
          kubectl get pvc -A
          kubectl -n routr describe pods | tail -120
          kubectl -n routr get events --sort-by=.lastTimestamp | tail -40
          # Memory working set per container (kubelet summary; no metrics-server)
          for node in $(kubectl get nodes -o name | cut -d/ -f2); do
            kubectl get --raw "/api/v1/nodes/$node/proxy/stats/summary" |
              jq -r '.pods[] | select(.podRef.namespace=="routr") | .podRef.name as $p | .containers[] | "memory \($p) \(.name) \((.memory.workingSetBytes // 0) / 1048576 | floor)Mi"'
          done
