name: Wave 5 essential tests on chart defaults
on:
  push:
    branches: [wave5-measure]
permissions:
  contents: read
jobs:
  cert:
    strategy:
      fail-fast: false
      matrix:
        cnf: [strimzi, otel-collector, valkey, keda, cloudnative-pg, nats, prometheus, external-secrets]
    name: ${{ matrix.cnf }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: lfn-cnti/testsuite-action@70536fda55fcb11f4f7463175fe9d57c86b85574 # v1.2.0
        with:
          version: v2.3.0
          cnf_config: cnf/${{ matrix.cnf }}/cnti-testsuite.yaml
          tests: cert
          log_level: info
          install_timeout: "900"
          fail_on_failure: "false"
          artifact_name: results-${{ matrix.cnf }}
      - name: Workloads
        if: always()
        run: |
          kubectl get deploy,sts,ds,pods -A -o wide | grep -v -E "kube-system|local-path-storage|cnti-testsuite|litmus" || true
