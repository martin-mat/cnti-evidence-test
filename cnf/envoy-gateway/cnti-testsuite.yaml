---
config_version: v2
common:
  workload_resource_labels:
  - key: gateway.envoyproxy.io/owning-gateway-name
    value: cnti
    namespace: envoy-gateway-system
deployments:
  helm_charts:
  - name: envoy-gateway
    registry_url: oci://docker.io/envoyproxy/gateway-helm
    chart_version: v1.9.2
    namespace: envoy-gateway-system
    priority: 1
  manifests:
  - name: gateway
    manifest_directory: manifests
    priority: 2
