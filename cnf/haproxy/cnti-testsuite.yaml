---
config_version: "v2"
deployments:
  helm_charts:
    - name: haproxy-ingress
      helm_repo_name: haproxytech
      helm_repo_url: https://haproxytech.github.io/helm-charts
      helm_chart_name: kubernetes-ingress
      chart_version: "1.54.3"
      namespace: haproxy-cnti
      # Scope: a ClusterIP service on kind (the default LoadBalancer stays pending).
      helm_values: --set controller.service.type=ClusterIP
