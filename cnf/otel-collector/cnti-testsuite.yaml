---
config_version: v2
deployments:
  helm_charts:
    - name: otel-collector
      helm_repo_name: open-telemetry
      helm_repo_url: https://open-telemetry.github.io/opentelemetry-helm-charts
      helm_chart_name: opentelemetry-collector
      chart_version: "0.176.0"
      namespace: otel
      # Required values: the chart has no default mode or image.
      helm_values: --set mode=deployment --set image.repository=otel/opentelemetry-collector-k8s
