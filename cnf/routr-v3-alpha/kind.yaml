# Four workers: EdgePort runs one replica per node by design (required pod
# anti-affinity, one EdgePort behind each node's externalTrafficPolicy Local
# share), so node_drain needs a third worker and increase_decrease_capacity,
# which scales its 2 replicas to 4, needs four.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: /tmp/kind-shared-storage
        containerPath: /var/local-path-provisioner
  - role: worker
    extraMounts:
      - hostPath: /tmp/kind-shared-storage
        containerPath: /var/local-path-provisioner
  - role: worker
    extraMounts:
      - hostPath: /tmp/kind-shared-storage
        containerPath: /var/local-path-provisioner
  - role: worker
    extraMounts:
      - hostPath: /tmp/kind-shared-storage
        containerPath: /var/local-path-provisioner
  - role: worker
    extraMounts:
      - hostPath: /tmp/kind-shared-storage
        containerPath: /var/local-path-provisioner
